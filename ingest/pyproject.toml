[project]
name = "ingest"
version = "0.1.0"
description = "Bank-agnostic scraper, loader and repair tooling for a self-hosted Sure instance"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.55",
  "pypdf>=5.0",
]

[project.scripts]
ingest = "ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: drives a real Chromium against the local fake bank",
  "sure: needs a running Sure instance (SURE_TEST_URL, SURE_TEST_API_KEY_FILE)",
]
