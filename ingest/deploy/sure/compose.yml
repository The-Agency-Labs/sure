# Sure for the finance VM. Copy to /opt/sure/compose.yml with .env next to it.
#
# Based on upstream compose.example.yml (keep in step when upgrading). Changes:
#   - web binds to SURE_BIND_ADDR only: 127.0.0.1 behind Tailscale Serve (tailnet-only HTTPS); APP_DOMAIN and SSL flags from .env;
#   - redis pinned instead of :latest;
#   - backups go to /srv/finance/sure-backups (the host dataset via virtiofs), every 6 hours;
#   - backup-offsite removed (host-side ZFS snapshots cover history);
#   - no OpenAI/hosted-LLM settings and no hard-coded public DNS servers;
#   - sure_net is an external network so the ingest loader can join it.
# The backup service keeps upstream's user "0"; web/worker keep the image's UID 1000.

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (openssl rand -hex 64)}"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
  SELF_HOSTED: "true"
  # Behind a reverse proxy that terminates TLS: RAILS_ASSUME_SSL=true in .env.
  APP_DOMAIN: ${APP_DOMAIN:-}
  RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
  RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  SIDEKIQ_CRON_GRACE_PERIOD_SECONDS: ${SIDEKIQ_CRON_GRACE_PERIOD_SECONDS:-}

services:
  web:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    volumes:
      - app-storage:/rails/storage
    ports:
      - "${SURE_BIND_ADDR:?set SURE_BIND_ADDR in .env}:${PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sure_net

  worker:
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rails_env
    networks:
      - sure_net

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  backup:
    # docker compose --profile backup up -d backup     (scheduled)
    # docker compose run --rm backup create            (right now)
    profiles:
      - backup
    image: ghcr.io/we-promise/sure:${SURE_IMAGE_TAG:-stable}
    user: "0"
    entrypoint: ["bin/sure-backup"]
    restart: unless-stopped
    volumes:
      - ${BACKUP_DIR:-/srv/finance/sure-backups}:/backups
      - app-storage:/rails/storage
      - .:/config:ro
    environment:
      <<: *db_env
      POSTGRES_HOST: db
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 */6 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      INSTANCE_ID: ${INSTANCE_ID:-finance}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sure_net

  redis:
    # Pinned: upstream uses :latest. After the first pull, consider pinning the
    # digest too (docker inspect --format '{{index .RepoDigests 0}}' redis:7.4).
    image: redis:7.4
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

volumes:
  app-storage:
  postgres-data:
  redis-data:

networks:
  sure_net:
    external: true
