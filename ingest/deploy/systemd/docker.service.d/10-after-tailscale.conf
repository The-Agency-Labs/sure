# Sure publishes its port on the VM's Tailscale IP only. Docker can't bind an
# address that doesn't exist yet, and a container that fails to bind at boot
# is not retried, so Docker waits for tailscaled and its IPv4 address.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 120); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "tailscale has no IPv4 address after 120s" >&2; exit 0'
